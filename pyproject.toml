[project]
name = "nexus"
version = "0.1.0"
description = "Nexus AI Pipeline - Polyglot monorepo for Réfugiés.info content processing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "nexus-common",
    "nexus-ingestion",
    "nexus-reconciliation",
    "nexus-enrichment",
    "nexus-langage-clair",
    "nexus-translation",
    "nexus-validation",
    "nexus-publication",
]

[tool.uv.workspace]
members = [
    "libs/common",
    "libs/ingestion",
    "libs/reconciliation",
    "libs/enrichment",
    "libs/langage_clair",
    "libs/translation",
    "libs/validation",
    "libs/publication",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "nbstripout>=0.7.0",
]

[tool.uv.sources]
nexus-common = { workspace = true }
nexus-ingestion = { workspace = true }
nexus-reconciliation = { workspace = true }
nexus-enrichment = { workspace = true }
nexus-langage-clair = { workspace = true }
nexus-translation = { workspace = true }
nexus-validation = { workspace = true }
nexus-publication = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["libs"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "contract: Contract tests validating API contracts",
    "integration: Integration tests across components",
    "unit: Unit tests for isolated functions",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["libs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
