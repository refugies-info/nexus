[pytest]
# Pytest configuration for Nexus Orchestration Service

# Minimum version
minversion = 7.0

# Python path
pythonpath = src

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require Supabase)
    contract: API contract tests
    slow: Slow tests (>1s)
    asyncio: Async tests

# Asyncio mode
asyncio_mode = auto

# Coverage options
[coverage:run]
source = src
branch = true
omit =
    */tests/*
    */__init__.py
    */main.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstractproperty
precision = 2
show_missing = true
